<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stem Separation</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(message);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(message);
    }
    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }
    function submit() {
      closeWithResult({
        cancelled: false,
        stemVariationId: document.getElementById("variation").value,
      });
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeWithResult({ cancelled: true }); });
    });
  </script>
</head>
<body>
  <p>Separate the selected audio into stems. Each stem is imported to a new audio track with balanced mixer levels.</p>
  <label for="variation">Stem layout
    <select id="variation">
      <option value="six_stems_v1">6 stems (vocals, drums, bass, guitar, piano, other)</option>
      <option value="two_stems_v1">2 stems (vocals + instrumental)</option>
    </select>
  </label>
  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Separate</button>
  </div>
</body>
</html>
