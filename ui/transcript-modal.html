<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs Transcript</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    *:not(dialog) { margin: 0; }
    button { font: inherit; }

    :root {
      --c-bg: hsl(0, 0%, 21%);
      --c-input-bg: hsl(0, 0%, 12%);
      --c-text: hsl(0, 0%, 71%);
      --c-text-secondary: hsl(0, 0%, 41%);
      --c-border: hsl(0, 0%, 7%);
      --c-button-bg: hsl(0, 0%, 16%);
      --c-accent: hsl(31, 100%, 67%);
    }

    html {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: "AbletonSansSmall", sans-serif;
      font-size: 11.5px;
      height: 100%;
    }

    body {
      height: 100%;
      padding: 1.25em;
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }

    h1 {
      font-size: 1em;
      font-weight: normal;
      color: var(--c-text-secondary);
    }

    pre {
      flex: 1;
      overflow: auto;
      background: var(--c-input-bg);
      border: 1px solid var(--c-border);
      padding: 0.75em;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
    }

    button {
      background: var(--c-button-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 1em;
      padding: 0.35em 1em;
      cursor: pointer;
    }

    button:active { background: var(--c-accent); color: #111; }
  </style>
</head>
<body>
  <pre id="transcript">{{TRANSCRIPT}}</pre>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Close</button>
  </div>
</body>
</html>
