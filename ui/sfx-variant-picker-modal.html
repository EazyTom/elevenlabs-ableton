<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick SFX Variant</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function submit() {
      const sel = document.querySelector('input[name="variant"]:checked');
      if (!sel) return;
      closeWithResult({
        cancelled: false,
        variantIndex: parseInt(sel.value, 10),
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
        if (e.key === "Enter") submit();
      });
    });
  </script>
  <style>
    body { gap: 0.65em; overflow-y: auto; }
    fieldset.variant-list {
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      max-height: 16em;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <p class="hint">Each variant is a separate generation with the same prompt. Pick one to import.</p>

  <fieldset class="variant-list">
    <legend>Variants</legend>
    {{VARIANT_OPTIONS}}
  </fieldset>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Use selected</button>
  </div>
</body>
</html>
