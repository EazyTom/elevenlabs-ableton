<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs Music</title>
  {{MUSIC_PROMPT_RANDOMIZER}}
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function checkedGenres() {
      return Array.from(document.querySelectorAll('input[name="genres"]:checked'))
        .map((el) => el.value);
    }

    function setError(message) {
      const el = document.getElementById("error");
      el.textContent = message || "";
      el.hidden = !message;
    }

    function updateTempoLabel() {
      const slider = document.getElementById("tempo");
      const label = document.getElementById("tempoValue");
      label.textContent = `${slider.value} BPM`;
    }

    function updateDurationLabel() {
      document.getElementById("lengthValue").textContent = `${document.getElementById("length").value} sec`;
    }

    function updateVariantsLabel() {
      document.getElementById("variantsValue").textContent = document.getElementById("variants").value;
    }

    function submit() {
      setError("");
      const prompt = document.getElementById("prompt").value.trim();
      const lengthSec = parseInt(document.getElementById("length").value, 10);
      const variants = parseInt(document.getElementById("variants").value, 10);
      const genres = checkedGenres();
      const useTempo = document.getElementById("useTempo").checked;
      const tempoBpm = useTempo ? parseInt(document.getElementById("tempo").value, 10) : undefined;

      if (!prompt && genres.length === 0) {
        setError("Add a prompt or pick at least one genre.");
        document.getElementById("prompt").focus();
        return;
      }

      closeWithResult({
        cancelled: false,
        prompt: prompt || undefined,
        musicLengthMs: Number.isFinite(lengthSec) ? lengthSec * 1000 : undefined,
        forceInstrumental: document.getElementById("instrumental").checked,
        genres,
        tempoBpm: useTempo && Number.isFinite(tempoBpm) ? tempoBpm : undefined,
        highEnergy: document.getElementById("highEnergy").checked,
        darkMood: document.getElementById("darkMood").checked,
        loFi: document.getElementById("loFi").checked,
        loop: document.getElementById("loop").checked,
        modelId: document.getElementById("modelId").value,
        variants: Number.isFinite(variants) ? variants : 1,
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("prompt").focus();
      document.getElementById("tempo").addEventListener("input", updateTempoLabel);
      document.getElementById("length").addEventListener("input", updateDurationLabel);
      document.getElementById("variants").addEventListener("input", updateVariantsLabel);
      document.getElementById("useTempo").addEventListener("change", (e) => {
        document.getElementById("tempo").disabled = !e.target.checked;
      });
      updateTempoLabel();
      updateDurationLabel();
      updateVariantsLabel();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    body { gap: 0.65em; overflow-y: auto; }
    textarea { min-height: 3.5em; }
    #tempoValue, .slider-value { min-width: 4.5em; color: var(--c-accent-secondary); }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5em;
    }
    .prompt-header label { flex: 1; margin: 0; }
    .loop-hint { font-size: 0.95em; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .slider-row input[type="range"] { flex: 1; }
    .stack-column {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }
    .stack-column label {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
    }
    fieldset.genres {
      max-height: 11em;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <p class="hint">Music generation requires an ElevenLabs paid plan.</p>
  <p id="error" class="error" hidden></p>

  <label class="slider-row">
    <span>Duration</span>
    <input id="length" type="range" min="3" max="300" step="1" value="30" />
    <span id="lengthValue" class="slider-value">30 sec</span>
  </label>

  <div class="prompt-header">
    <label for="prompt">Description (optional if genres selected)</label>
    <button type="button" onclick="randomizePrompt()">Randomize</button>
  </div>
  <textarea id="prompt" placeholder="Mood, instruments, structure…"></textarea>

  <label class="tempo-row">
    <input id="useTempo" type="checkbox" />
    <span>Tempo</span>
    <input id="tempo" type="range" min="60" max="180" step="1" value="120" disabled />
    <span id="tempoValue">120 BPM</span>
  </label>

  <fieldset class="genres">
    <legend>Genres</legend>
    <div class="toggle-grid">
      <label class="toggle"><input type="checkbox" name="genres" value="trap" /> Trap</label>
      <label class="toggle"><input type="checkbox" name="genres" value="house" /> House</label>
      <label class="toggle"><input type="checkbox" name="genres" value="techno" /> Techno</label>
      <label class="toggle"><input type="checkbox" name="genres" value="dnb" /> Drum &amp; Bass</label>
      <label class="toggle"><input type="checkbox" name="genres" value="dubstep" /> Dubstep</label>
      <label class="toggle"><input type="checkbox" name="genres" value="hipHop" /> Hip-hop</label>
      <label class="toggle"><input type="checkbox" name="genres" value="epic" /> Epic</label>
      <label class="toggle"><input type="checkbox" name="genres" value="atmospheric" /> Atmospheric</label>
      <label class="toggle"><input type="checkbox" name="genres" value="horror" /> Horror</label>
      <label class="toggle"><input type="checkbox" name="genres" value="documentary" /> Documentary</label>
      <label class="toggle"><input type="checkbox" name="genres" value="sciFi" /> Sci-Fi</label>
      <label class="toggle"><input type="checkbox" name="genres" value="bollywood" /> Bollywood</label>
      <label class="toggle"><input type="checkbox" name="genres" value="ambientMusic" /> Ambient</label>
      <label class="toggle"><input type="checkbox" name="genres" value="jungle" /> Jungle</label>
      <label class="toggle"><input type="checkbox" name="genres" value="rock90s" /> 90s Rock</label>
      <label class="toggle"><input type="checkbox" name="genres" value="disco" /> Disco</label>
      <label class="toggle"><input type="checkbox" name="genres" value="folk" /> Folk</label>
      <label class="toggle"><input type="checkbox" name="genres" value="retro80s" /> 80s Retro</label>
      <label class="toggle"><input type="checkbox" name="genres" value="indie90s" /> 90s Indie</label>
      <label class="toggle"><input type="checkbox" name="genres" value="country" /> Country</label>
      <label class="toggle"><input type="checkbox" name="genres" value="bluegrass" /> Bluegrass</label>
      <label class="toggle"><input type="checkbox" name="genres" value="jazz" /> Jazz</label>
      <label class="toggle"><input type="checkbox" name="genres" value="classical" /> Classical</label>
      <label class="toggle"><input type="checkbox" name="genres" value="acoustic" /> Acoustic</label>
    </div>
  </fieldset>

  <div class="toggle-grid">
    <label class="toggle"><input id="instrumental" type="checkbox" /> Instrumental</label>
    <label class="toggle"><input id="highEnergy" type="checkbox" /> High energy</label>
    <label class="toggle"><input id="darkMood" type="checkbox" /> Dark / moody</label>
    <label class="toggle"><input id="loFi" type="checkbox" /> Lo-fi</label>
  </div>

  <label class="slider-row">
    <span>Variants</span>
    <input id="variants" type="range" min="1" max="10" step="1" value="1" />
    <span id="variantsValue" class="slider-value">1</span>
  </label>

  <div class="stack-column">
    <label for="modelId">Model
      <select id="modelId">
        <option value="music_v1">Music v1</option>
        <option value="music_v2" selected>Music v2</option>
      </select>
    </label>
  </div>

  <label class="checkbox">
    <input id="loop" type="checkbox" />
    Seamless Loop
  </label>
  <p class="hint loop-hint">For loops, try 8–30 seconds. Variants load into the selected slot and the slots below it.</p>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
