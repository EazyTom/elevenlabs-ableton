<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clone Voice</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(message);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(message);
    }
    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }
    function submit() {
      const name = document.getElementById("name").value.trim();
      if (!name) return;
      closeWithResult({ cancelled: false, name });
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("name").focus();
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeWithResult({ cancelled: true }); });
    });
  </script>
</head>
<body>
  <p>Instant voice clone from the selected audio. Minimum ~30 seconds of clear speech recommended.</p>
  <label for="name">Voice name</label>
  <input id="name" type="text" placeholder="My Live Session Voice" />
  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Clone</button>
  </div>
</body>
</html>
