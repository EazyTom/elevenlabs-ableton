<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs TTS</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function sliderValue(id) {
      return parseFloat(document.getElementById(id).value);
    }

    function updateSpeedLabel() {
      document.getElementById("speedValue").textContent =
        `${sliderValue("speed").toFixed(2)}×`;
    }

    function updatePercentLabel(id, labelId) {
      document.getElementById(labelId).textContent =
        `${Math.round(sliderValue(id) * 100)}%`;
    }

    function submit() {
      const text = document.getElementById("text").value.trim();
      const voiceId = document.getElementById("voiceId").value.trim()
        || document.getElementById("voiceSelect").value.trim();
      if (!text) return;
      closeWithResult({
        cancelled: false,
        text,
        voiceId: voiceId || undefined,
        speed: sliderValue("speed"),
        stability: sliderValue("stability"),
        similarityBoost: sliderValue("similarity"),
        style: sliderValue("style"),
      });
    }

    function onVoiceSelect() {
      const sel = document.getElementById("voiceSelect");
      const custom = document.getElementById("voiceId");
      if (sel.value) custom.value = sel.value;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("text").focus();
      document.getElementById("speed").addEventListener("input", updateSpeedLabel);
      document.getElementById("stability").addEventListener("input", () => updatePercentLabel("stability", "stabilityValue"));
      document.getElementById("similarity").addEventListener("input", () => updatePercentLabel("similarity", "similarityValue"));
      document.getElementById("style").addEventListener("input", () => updatePercentLabel("style", "styleValue"));
      updateSpeedLabel();
      updatePercentLabel("stability", "stabilityValue");
      updatePercentLabel("similarity", "similarityValue");
      updatePercentLabel("style", "styleValue");
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    textarea { min-height: 4em; }
    body { gap: 0.65em; overflow-y: auto; }
    .voice-settings { gap: 0.45em; }
    .voice-settings .tempo-row span:first-child { min-width: 9em; }
    .voice-settings .tempo-row span:last-child {
      min-width: 3.5em;
      text-align: right;
      color: var(--c-accent-secondary);
    }
  </style>
</head>
<body>
  <label for="text">Text to speak</label>
  <textarea id="text" placeholder="Enter text for ElevenLabs TTS…"></textarea>

  <label for="voiceSelect">Voice (from library)</label>
  <select id="voiceSelect" onchange="onVoiceSelect()">{{VOICE_OPTIONS}}</select>

  <label for="voiceId">Voice ID (override or custom)</label>
  <input id="voiceId" type="text" placeholder="Leave blank for default" />

  <fieldset class="voice-settings">
    <legend>Voice settings</legend>
    <label class="tempo-row">
      <span>Speed</span>
      <input id="speed" type="range" min="0.7" max="1.2" step="0.05" value="1" />
      <span id="speedValue">1.00×</span>
    </label>
    <label class="tempo-row">
      <span>Stability</span>
      <input id="stability" type="range" min="0" max="1" step="0.05" value="0.5" />
      <span id="stabilityValue">50%</span>
    </label>
    <label class="tempo-row">
      <span>Similarity</span>
      <input id="similarity" type="range" min="0" max="1" step="0.05" value="0.75" />
      <span id="similarityValue">75%</span>
    </label>
    <label class="tempo-row">
      <span>Style exaggeration</span>
      <input id="style" type="range" min="0" max="1" step="0.05" value="0" />
      <span id="styleValue">0%</span>
    </label>
  </fieldset>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
