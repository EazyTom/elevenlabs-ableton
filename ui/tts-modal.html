<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs TTS</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function submit() {
      const text = document.getElementById("text").value.trim();
      const voiceId = document.getElementById("voiceId").value.trim()
        || document.getElementById("voiceSelect").value.trim();
      if (!text) return;
      closeWithResult({
        cancelled: false,
        text,
        voiceId: voiceId || undefined,
      });
    }

    function onVoiceSelect() {
      const sel = document.getElementById("voiceSelect");
      const custom = document.getElementById("voiceId");
      if (sel.value) custom.value = sel.value;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("text").focus();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    *:not(dialog) { margin: 0; }
    input, button, textarea { font: inherit; }

    :root {
      --c-bg: hsl(0, 0%, 21%);
      --c-input-bg: hsl(0, 0%, 12%);
      --c-text: hsl(0, 0%, 71%);
      --c-text-secondary: hsl(0, 0%, 41%);
      --c-border: hsl(0, 0%, 7%);
      --c-button-bg: hsl(0, 0%, 16%);
      --c-accent: hsl(31, 100%, 67%);
    }

    html {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: "AbletonSansSmall", sans-serif;
      font-size: 11.5px;
      height: 100%;
    }

    body {
      height: 100%;
      padding: 1.25em;
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
      color: var(--c-text-secondary);
    }

    textarea, input, select {
      background: var(--c-input-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      padding: 0.4em 0.5em;
      width: 100%;
      outline: none;
    }

    textarea {
      min-height: 5em;
      resize: vertical;
    }

    textarea:focus, input:focus {
      outline: 2px solid var(--c-text-secondary);
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5em;
      margin-top: auto;
    }

    button {
      background: var(--c-button-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 1em;
      padding: 0.35em 1em;
      cursor: pointer;
    }

    button.primary:active {
      background: var(--c-accent);
      color: #111;
    }
  </style>
</head>
<body>
  <label for="text">Text to speak</label>
  <textarea id="text" placeholder="Enter text for ElevenLabs TTS…"></textarea>

  <label for="voiceSelect">Voice (from library)</label>
  <select id="voiceSelect" onchange="onVoiceSelect()">{{VOICE_OPTIONS}}</select>

  <label for="voiceId">Voice ID (override or custom)</label>
  <input id="voiceId" type="text" placeholder="Leave blank for default" />

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
