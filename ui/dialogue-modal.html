<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs Dialogue</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function submit() {
      const voiceA = document.getElementById("voiceA").value;
      const voiceB = document.getElementById("voiceB").value;
      const script = document.getElementById("script").value.trim();
      if (!script || !voiceA || !voiceB) return;
      closeWithResult({ cancelled: false, voiceA, voiceB, script });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("script").focus();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    *:not(dialog) { margin: 0; }
    input, button, textarea, select { font: inherit; }

    :root {
      --c-bg: hsl(0, 0%, 21%);
      --c-input-bg: hsl(0, 0%, 12%);
      --c-text: hsl(0, 0%, 71%);
      --c-text-secondary: hsl(0, 0%, 41%);
      --c-border: hsl(0, 0%, 7%);
      --c-button-bg: hsl(0, 0%, 16%);
      --c-accent: hsl(31, 100%, 67%);
    }

    html {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: "AbletonSansSmall", sans-serif;
      font-size: 11.5px;
      height: 100%;
    }

    body {
      height: 100%;
      padding: 1.25em;
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
      color: var(--c-text-secondary);
    }

    textarea, input, select {
      background: var(--c-input-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      padding: 0.4em 0.5em;
      width: 100%;
      outline: none;
    }

    textarea { min-height: 6em; resize: vertical; }
    .row { display: flex; gap: 0.75em; }
    .row label { flex: 1; }

    .hint { color: var(--c-text-secondary); line-height: 1.4; }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5em;
      margin-top: auto;
    }

    button {
      background: var(--c-button-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 1em;
      padding: 0.35em 1em;
      cursor: pointer;
    }

    button.primary:active { background: var(--c-accent); color: #111; }
  </style>
</head>
<body>
  <p class="hint">Prefix each line with <strong>1:</strong> or <strong>2:</strong> for speaker A or B.</p>

  <div class="row">
    <label for="voiceA">Speaker A voice
      <select id="voiceA">{{VOICE_OPTIONS_A}}</select>
    </label>
    <label for="voiceB">Speaker B voice
      <select id="voiceB">{{VOICE_OPTIONS_B}}</select>
    </label>
  </div>

  <label for="script">Dialogue script</label>
  <textarea id="script" placeholder="1: [giggling] Knock knock&#10;2: Who is there?&#10;1: It's ElevenLabs!"></textarea>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
