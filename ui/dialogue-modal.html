<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs Dialogue</title>
  <script>
    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function submit() {
      const voiceA = document.getElementById("voiceA").value;
      const voiceB = document.getElementById("voiceB").value;
      const script = document.getElementById("script").value.trim();
      if (!script || !voiceA || !voiceB) return;
      closeWithResult({ cancelled: false, voiceA, voiceB, script });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("script").focus();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
      });
    });
  </script>
  <style>
    textarea { min-height: 6em; }
  </style>
</head>
<body>
  <p class="hint">Prefix each line with <strong>1:</strong> or <strong>2:</strong> for speaker A or B.</p>

  <div class="row">
    <label for="voiceA">Speaker A voice
      <select id="voiceA">{{VOICE_OPTIONS_A}}</select>
    </label>
    <label for="voiceB">Speaker B voice
      <select id="voiceB">{{VOICE_OPTIONS_B}}</select>
    </label>
  </div>

  <label for="script">Dialogue script</label>
  <textarea id="script" placeholder="1: [giggling] Knock knock&#10;2: Who is there?&#10;1: It's ElevenLabs!"></textarea>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
