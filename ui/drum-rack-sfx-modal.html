<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drum Rack SFX</title>
  {{DRUM_PAD_RANDOMIZER}}
  <script>
    const LIVE_NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function doSendMessage(message) {
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function noteName(midiNote) {
      const n = Math.round(midiNote);
      if (n < 0 || n > 127) return String(n);
      const octave = Math.floor(n / 12) - 2;
      return LIVE_NOTE_NAMES[n % 12] + octave;
    }

    function durationFromSlider(id) {
      return parseInt(document.getElementById(id).value, 10) / 2;
    }

    function updateDurationLabel(id, valueId, autoId) {
      if (autoId && document.getElementById(autoId)?.checked) {
        document.getElementById(valueId).textContent = "Auto";
        return;
      }
      document.getElementById(valueId).textContent = `${durationFromSlider(id).toFixed(1)} sec`;
    }

    function syncPadAutoDuration(padIndex) {
      const autoId = "padAutoDuration_" + padIndex;
      const durId = "padDuration_" + padIndex;
      const valueId = "padDurationValue_" + padIndex;
      const auto = document.getElementById(autoId)?.checked;
      const slider = document.getElementById(durId);
      if (slider) slider.disabled = auto;
      updateDurationLabel(durId, valueId, autoId);
    }

    function influenceFromSlider() {
      return parseInt(document.getElementById("influence").value, 10) / 10;
    }

    function updateInfluenceLabel() {
      document.getElementById("influenceValue").textContent = influenceFromSlider().toFixed(1);
    }

    function setError(message) {
      const el = document.getElementById("error");
      el.textContent = message || "";
      el.hidden = !message;
    }

    function startMidiNoteValue() {
      return parseInt(document.getElementById("startMidiNote").value, 10);
    }

    function updatePadLabels() {
      const startNote = startMidiNoteValue();
      for (let i = 0; i < DRUM_PAD_SLOT_COUNT; i++) {
        const midi = startNote + i;
        const label = document.getElementById("padLabel_" + i);
        if (label) label.textContent = `Drum Pad ${i + 1} → ${noteName(midi)} (${midi})`;
      }
    }

    function syncPadRowEnabled(padIndex) {
      const enabled = document.getElementById("padEnabled_" + padIndex).checked;
      const row = document.getElementById("padRow_" + padIndex);
      if (row) row.classList.toggle("pad-row-disabled", !enabled);
    }

    function setOnlyFirstPadEnabled() {
      for (let i = 0; i < DRUM_PAD_SLOT_COUNT; i++) {
        const on = i === 0;
        document.getElementById("padEnabled_" + i).checked = on;
        syncPadRowEnabled(i);
      }
    }

    function onPadTypeChange(padIndex) {
      applyTypeCharacteristics(padIndex);
    }

    function onBuildKitChange() {
      const buildKit = document.getElementById("buildDrumKit").checked;
      if (buildKit) {
        for (let i = 0; i < DRUM_PAD_SLOT_COUNT; i++) {
          document.getElementById("padEnabled_" + i).checked = true;
          syncPadRowEnabled(i);
          const typeEl = document.getElementById("padType_" + i);
          if (typeEl && DEFAULT_KIT_TYPE_BY_PAD[i]) {
            typeEl.value = DEFAULT_KIT_TYPE_BY_PAD[i];
            applyTypeCharacteristics(i);
          }
          randomizePadPhrase(i);
        }
      } else {
        setOnlyFirstPadEnabled();
      }
    }

    function collectPads() {
      const pads = [];
      for (let i = 0; i < DRUM_PAD_SLOT_COUNT; i++) {
        const autoDuration = document.getElementById("padAutoDuration_" + i).checked;
        pads.push({
          padIndex: i,
          enabled: document.getElementById("padEnabled_" + i).checked,
          type: document.getElementById("padType_" + i).value,
          stylePhrase: document.getElementById("padPhrase_" + i).value.trim(),
          characteristics: document.getElementById("padCharacteristics_" + i).value.trim(),
          durationSeconds: durationFromSlider("padDuration_" + i),
          autoDuration,
        });
      }
      return pads;
    }

    function submit() {
      setError("");
      const pads = collectPads();
      if (!pads.some((p) => p.enabled)) {
        setError("Enable at least one drum pad to generate.");
        return;
      }

      const startMidiNote = startMidiNoteValue();
      const lastEnabled = pads.filter((p) => p.enabled).reduce((max, p) => Math.max(max, p.padIndex), 0);
      if (startMidiNote + lastEnabled > 127) {
        setError(`Enabled pads exceed MIDI 127 from ${noteName(startMidiNote)}.`);
        return;
      }

      closeWithResult({
        cancelled: false,
        pads,
        startMidiNote,
        kickKey: document.getElementById("kickKey").value.trim() || undefined,
        snareKey: document.getElementById("snareKey").value.trim() || undefined,
        overwriteOccupied: document.getElementById("overwriteOccupied").checked,
        promptInfluence: influenceFromSlider(),
        outputFormat: document.getElementById("outputFormat").value,
        modelId: document.getElementById("modelId").value,
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("buildDrumKit").addEventListener("change", onBuildKitChange);
      document.getElementById("startMidiNote").addEventListener("change", updatePadLabels);
      document.getElementById("influence").addEventListener("input", updateInfluenceLabel);

      for (let i = 0; i < DRUM_PAD_SLOT_COUNT; i++) {
        const enabled = document.getElementById("padEnabled_" + i);
        const dur = document.getElementById("padDuration_" + i);
        const autoDur = document.getElementById("padAutoDuration_" + i);
        const typeEl = document.getElementById("padType_" + i);
        enabled.addEventListener("change", () => syncPadRowEnabled(i));
        dur.addEventListener("input", () => syncPadAutoDuration(i));
        autoDur.addEventListener("change", () => syncPadAutoDuration(i));
        typeEl.addEventListener("change", () => onPadTypeChange(i));
        syncPadRowEnabled(i);
        syncPadAutoDuration(i);
      }

      updatePadLabels();
      updateInfluenceLabel();

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeWithResult({ cancelled: true });
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit();
      });
    });
  </script>
  <style>
    body { gap: 0.65em; overflow-y: auto; }
    .loop-hint, .quality-hint, .mode-hint { font-size: 0.95em; }
    .slider-value { min-width: 3.5em; color: var(--c-accent-secondary); text-align: right; }
    .control-label { min-width: 4.5em; flex-shrink: 0; }
    .stack-column { display: flex; flex-direction: column; gap: 0.5em; }
    .stack-column label { display: flex; flex-direction: column; gap: 0.25em; }
    #padSection { display: flex; flex-direction: column; gap: 0.45em; }
    .pad-row {
      border: 1px solid var(--c-border, hsl(0, 0%, 28%));
      border-radius: 4px;
      padding: 0.4em 0.55em;
      display: flex;
      flex-direction: column;
      gap: 0.3em;
    }
    .pad-row.pad-row-disabled { opacity: 0.45; }
    .pad-row-header {
      display: flex;
      align-items: center;
      gap: 0.45em;
      flex-wrap: wrap;
    }
    .pad-enable { flex-shrink: 0; margin: 0; }
    .pad-label { flex: 1; font-size: 0.95em; min-width: 8em; }
    .pad-type { min-width: 7em; flex-shrink: 0; }
    .pad-randomize { flex-shrink: 0; padding: 0.15em 0.45em; font-size: 0.9em; }
    .pad-phrase, .pad-characteristics { width: 100%; }
    .pad-characteristics { min-height: 2.4em; font-size: 0.92em; }
    .pad-duration-row { margin: 0; gap: 0.35em; }
    .pad-duration-row .slider-value { text-align: left; min-width: 2.8em; }
    .pad-auto-inline { flex-shrink: 0; margin: 0; white-space: nowrap; font-size: 0.9em; }
    .pad-auto-inline input { margin-right: 0.2em; }
    .top-toggles { display: flex; flex-direction: column; gap: 0.35em; }
    .start-keys-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75em 1.25em;
    }
    .start-keys-row label {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
      margin: 0;
      min-width: 6.5em;
    }
    .start-keys-row select { min-width: 6.5em; }
    .kit-options { display: flex; flex-direction: column; gap: 0.35em; }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5em;
    }
  </style>
</head>
<body>
  <p>Generate SFX and load into Drum Rack pads. Missing cells get a new Simpler automatically.</p>

  <p id="error" class="error" hidden></p>

  <div class="top-toggles">
    <label class="checkbox">
      <input id="buildDrumKit" type="checkbox" />
      Build entire drum kit (enable all pads, preset types, randomize phrases)
    </label>
    <label class="checkbox">
      <input id="overwriteOccupied" type="checkbox"{{OVERWRITE_CHECKED}} />
      Overwrite pads that already have a sample
    </label>
  </div>

  <div class="start-keys-row">
    <label for="startMidiNote">Start pad
      <select id="startMidiNote">{{START_NOTE_OPTIONS}}</select>
    </label>
    <label for="kickKey">Kick key
      <select id="kickKey">{{KICK_KEY_OPTIONS}}</select>
    </label>
    <label for="snareKey">Snare key
      <select id="snareKey">{{SNARE_KEY_OPTIONS}}</select>
    </label>
  </div>

  <div class="kit-options">
    <div class="prompt-header">
      <span>Randomize all style phrases</span>
      <button type="button" onclick="randomizeAllPadPhrases()">Randomize all</button>
    </div>
  </div>

  <div id="padSection">
    {{DRUM_PAD_ROWS}}
  </div>

  <div class="stack-column">
    <label for="modelId">Model
      <select id="modelId">
        <option value="eleven_text_to_sound_v1">SFX v1</option>
        <option value="eleven_text_to_sound_v2" selected>SFX v2</option>
      </select>
    </label>
    <label for="outputFormat">Quality
      <select id="outputFormat">
        <option value="mp3_44100_128" selected>MP3 128 kbps (default)</option>
        <option value="mp3_44100_64">MP3 64 kbps</option>
        <option value="mp3_44100_96">MP3 96 kbps</option>
        <option value="mp3_44100_192">MP3 192 kbps</option>
        <option value="pcm_44100">PCM 44.1 kHz</option>
        <option value="opus_48000_128">Opus 128 kbps</option>
      </select>
    </label>
  </div>

  <label class="tempo-row">
    <span class="control-label">Influence</span>
    <input id="influence" type="range" min="0" max="10" step="1" value="3" />
    <span id="influenceValue" class="slider-value">0.3</span>
  </label>

  <p class="hint quality-hint">MP3 192 kbps and PCM formats require a higher ElevenLabs plan (Creator or Pro).</p>

  <div class="buttons">
    <button type="button" onclick='closeWithResult({ cancelled: true })'>Cancel</button>
    <button type="button" class="primary" onclick="submit()">Generate</button>
  </div>
</body>
</html>
